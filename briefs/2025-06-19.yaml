headline: "Major Hurricane Strikes Mexico Coast as Oregon Wildfires See Containment Progress"
summary: Hurricane Erick made a historic Category 3 landfall in southern Mexico with 125 mph winds, marking it as the first Eastern Pacific major hurricane on record to make landfall in Mexico prior to August. After rapidly intensifying to Category 4 before landfall, Erick is now moving inland and is expected to dissipate by late tonight or early Friday, though it will continue to impact southern Mexico throughout the day. The hurricane is bringing life-threatening rainfall flooding, with 8 to 12 inches (and locally up to 16 inches) possible in Oaxaca and Guerrero states, posing a threat for flash flooding and mudslides, and gusty winds are also expected. Concurrently, firefighters have made significant progress in containing wildfires in Oregon. The Alder Springs Fire, burning west of Crooked River Ranch, is now 21% contained across 3,278 acres, leading to the dropping of all Level 3—Go Now evacuation orders and allowing residents to return home, with no structures reported burned. Separately, the Upper Applegate Fire is burning at 470 acres and is 70 percent lined.


